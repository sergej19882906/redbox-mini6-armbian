name: Armbian + LibreELEC for Redbox Mini 6 (v1)

on:
  workflow_dispatch:
  push:
    branches:
      - 'vibe/redbox-mini6-armbian-e6d327'
    paths:
      - '.github/workflows/armbian.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: minimal
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNELBRANCH=tag:v6.18.40 KERNEL_CONFIGURE=no"
          - id: lxqt
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=no BUILD_DESKTOP=yes DESKTOP_ENVIRONMENT=lxqt DESKTOP_TIER=minimal KERNELBRANCH=tag:v6.18.40 KERNEL_CONFIGURE=no"
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build Armbian (${{ matrix.id }})
        run: |
          sudo apt-get update
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          git clone --depth=1 --branch v26.8.0-trunk.424 https://github.com/armbian/build.git /tmp/armbian-build
          cd /tmp/armbian-build
          sudo -E ./compile.sh build ${{ matrix.args }}
          sudo chown -R runner:runner output
          ls -lh output/images/

      - name: Inject Redbox Mini 6 DTB
        run: |
          for f in /tmp/armbian-build/output/images/*.img; do
            sudo bash scripts/inject-dtb.sh "$f"
          done

      - name: Cache mpv/ffmpeg (v4l2-request) builds
        uses: actions/cache@v4
        with:
          path: /tmp/mpv-v4l2req.tar.gz
          key: mpv-v4l2req-ffmpeg-v4l2request-mpv-0.42.0-v2

      - name: Install mpv with v4l2-request hwdec
        run: |
          for f in /tmp/armbian-build/output/images/*.img; do
            sudo bash scripts/install-mpv-hwdec.sh "$f"
          done

      - name: Compress
        run: |
          for f in /tmp/armbian-build/output/images/*.img; do
            out="/tmp/redbox-mini6-${VARIANT}-$(date +%Y%m%d).img.xz"
            xz -T0 -2 -c "$f" > "$out"
            sha256sum "$out" | tee /tmp/redbox-mini6-${VARIANT}.sha256
            rm -f "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: redbox-mini6-${{ matrix.id }}
          path: /tmp/redbox-mini6-${{ matrix.id }}-*.img.xz
          compression-level: 0
          if-no-files-found: error
          retry-attempts: 3

  build-libreelec:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build LibreELEC (H6 / tanix-tx6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev bc bison build-essential bzip2 \
            flex gawk gettext gperf intltool libfl-dev libncurses-dev \
            libparse-yapp-perl libtool libxml-parser-perl libzip-dev lzop \
            patchutils pkg-config python3 rdfind rsync shtool swig unzip \
            uuid-dev wget default-jre-headless xfonts-utils xsltproc \
            zlib1g-dev curl lua5.2
          git clone --depth=1 --branch 12.95.1 https://github.com/LibreELEC/LibreELEC.tv.git /tmp/le-build
          sed -e 's|PKG_VERSION="1.8.3"|PKG_VERSION="1.8.2"|' \
              -e 's|PKG_SHA256="21b26bc75cd37b548d7952f2794cde711efa6c6151c4147cc3c52cfedbf11df4"|PKG_SHA256="3b888e01f3d25f7914bbfd31139066bb4547e079322975134b03c92e4c6a2066"|' \
              -i /tmp/le-build/packages/debug/libunwind/package.mk
          sed -e 's|http://bitmath.org/code/mtdev/|https://bitmath.se/org/code/mtdev/|' \
              -i /tmp/le-build/packages/wayland/mtdev/package.mk
          grep -E 'PKG_VERSION|PKG_SHA256' /tmp/le-build/packages/debug/libunwind/package.mk
          grep -E 'PKG_URL' /tmp/le-build/packages/wayland/mtdev/package.mk
          cd /tmp/le-build
          PROJECT=Allwinner DEVICE=H6 ARCH=aarch64 make image
          find target -maxdepth 1 -name '*.img*' | xargs ls -lh

      - name: Inject Redbox Mini 6 DTB
        run: |
          shopt -s nullglob
          for f in /tmp/le-build/target/*tanix-tx6*.img.gz; do gunzip -kf "$f"; done
          for f in /tmp/le-build/target/*tanix-tx6*.img; do
            sudo bash scripts/inject-le-dtb.sh "$f"
          done
          ls -lh /tmp/le-build/target/

      - name: Compress
        run: |
          for f in /tmp/le-build/target/*tanix-tx6*.img; do
            [ -f "$f" ] || continue
            out="/tmp/libreelec-redbox-mini6-$(date +%Y%m%d).img.xz"
            xz -T0 -2 -c "$f" > "$out"
            sha256sum "$out" | tee /tmp/libreelec-redbox-mini6.sha256
            rm -f "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libreelec-redbox-mini6
          path: /tmp/libreelec-redbox-mini6-*.img.xz
          compression-level: 0
          if-no-files-found: error
