name: Armbian for Redbox Mini 6 (v1)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: minimal
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no"
          - id: lxqt
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=no BUILD_DESKTOP=yes DESKTOP_ENVIRONMENT=lxqt DESKTOP_TIER=minimal KERNEL_CONFIGURE=no"
    env:
      VARIANT: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build Armbian (${{ matrix.id }})
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          git clone --depth=1 --branch v26.8.0-trunk.424 https://github.com/armbian/build.git /tmp/armbian-build
          cd /tmp/armbian-build
          sudo -E ./compile.sh build ${{ matrix.args }}
          sudo chown -R runner:runner output
          ls -lh output/images/

      - name: Inject Redbox Mini 6 DTB
        run: |
          for f in /tmp/armbian-build/output/images/*.img; do
            sudo bash scripts/inject-dtb.sh "$f"
          done

      - name: Compress
        run: |
          for f in /tmp/armbian-build/output/images/*.img; do
            out="/tmp/redbox-mini6-${VARIANT}-$(date +%Y%m%d).img.xz"
            xz -T0 -2 -c "$f" > "$out"
            sha256sum "$out" | tee /tmp/redbox-mini6-${VARIANT}.sha256
            rm -f "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: redbox-mini6-${{ matrix.id }}
          path: /tmp/redbox-mini6-${{ matrix.id }}-*.img.xz
          compression-level: 0
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="redbox-mini6-${VARIANT}-run${{ github.run_number }}"
          sudo chown -R runner /tmp/redbox-mini6-*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" \
            /tmp/redbox-mini6-${VARIANT}-*.img.xz /tmp/redbox-mini6-${VARIANT}.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Redbox Mini 6 (v1) — Armbian 26.8 — ${VARIANT}" \
            --notes "Armbian 26.8 для Redbox Mini 6 v1 (Allwinner H6, 1 ГБ RAM), вариант: ${VARIANT}. Записывайте так: xz -d файл.img.xz, затем dd/Rufus/Etcher."
