name: Armbian + LibreELEC for Redbox Mini 6 (v1) # dispatch marker: 2026-11-27 12:1x (lxqt attempt 17)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/armbian.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: armbian-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: minimal
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNELBRANCH=tag:v6.18.40 KERNEL_CONFIGURE=no"
          - id: lxqt
            args: "BOARD=tanix-tx6 BRANCH=current RELEASE=trixie BUILD_MINIMAL=no BUILD_DESKTOP=yes DESKTOP_ENVIRONMENT=lxqt DESKTOP_TIER=minimal KERNELBRANCH=tag:v6.18.40 KERNEL_CONFIGURE=no"
    env:
      VARIANT: ${{ matrix.id }}
      COURIER_PREFIX: redbox-mini6-${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore image from cache (instant-delivery path)
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/redbox-mini6-${{ matrix.id }}*.img.xz
            /tmp/redbox-mini6-${{ matrix.id }}.sha256
          key: img-redbox-mini6-${{ matrix.id }}-none
          restore-keys: |
            img-redbox-mini6-${{ matrix.id }}-

      - name: Plan (is a build needed?)
        id: plan
        run: |
          if ls /tmp/${COURIER_PREFIX}-*.img.xz >/dev/null 2>&1; then
            echo "image already available from cache - skipping build, going straight to delivery"
            ls -lh /tmp/${COURIER_PREFIX}*
            echo "need_build=no" >> "$GITHUB_OUTPUT"
          else
            echo "no cached image - full build required"
            echo "need_build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate (skip variant if its asset is already on v1.0)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(timeout 60 gh release view v1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|join(" ")' 2>/dev/null || echo '')
          if [ -z "$names" ] && ! timeout 45 git ls-remote -q origin >/dev/null 2>&1; then
            echo "zone incident: API and git both unreachable - skipping build, next cron will retry"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$names" | grep -q "redbox-mini6-${VARIANT}-.*\.img\.xz"; then
            if echo "$names" | grep -q "redbox-mini6-${VARIANT}\.sha256"; then
              echo "skip=yes" >> "$GITHUB_OUTPUT"
              echo "asset ${VARIANT} complete on v1.0 - skip"
            else
              echo "skip=sha" >> "$GITHUB_OUTPUT"
              echo "image ${VARIANT} present but .sha256 missing - will complete checksum only"
            fi
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "asset ${VARIANT} missing - build"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build Armbian (${{ matrix.id }})
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        run: |
          sudo apt-get update
          if [ "$(uname -m)" = "x86_64" ]; then
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          fi
          git clone --depth=1 --branch v26.8.0-trunk.424 https://github.com/armbian/build.git /tmp/armbian-build
          cd /tmp/armbian-build
          rc=0
          sudo -E ./compile.sh build ${{ matrix.args }} 2>&1 | tee compile.log || rc=$?
          sudo chown -R runner:runner output
          ls -lh output/images/
          df -h /
          imgs=$(ls output/images/*.img 2>/dev/null | wc -l)
          echo "images produced: $imgs" >> "$GITHUB_STEP_SUMMARY"
          ls -l output/images/*.img* >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$rc" -ne 0 ] || [ "$imgs" -lt 1 ]; then
            echo "## Armbian build FAILED (rc=$rc, images=$imgs)" >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 compile.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            grep -viE 'token|password' compile.log | tail -n 25 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Inject Redbox Mini 6 DTB
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        run: |
          shopt -s nullglob
          imgs=(/tmp/armbian-build/output/images/*.img)
          [ ${#imgs[@]} -ge 1 ] || { echo "##[error]no .img found for DTB injection"; exit 1; }
          for f in "${imgs[@]}"; do
            sudo bash scripts/inject-dtb.sh "$f"
          done

      - name: Cache mpv/ffmpeg (v4l2-request) builds
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        uses: actions/cache@v4
        with:
          path: /tmp/mpv-v4l2req.tar.gz
          key: mpv-v4l2req-ffmpeg-v4l2request-mpv-0.42.0-v2

      - name: Install mpv with v4l2-request hwdec
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        run: |
          shopt -s nullglob
          imgs=(/tmp/armbian-build/output/images/*.img)
          [ ${#imgs[@]} -ge 1 ] || { echo "##[error]no .img found for mpv install"; exit 1; }
          for f in "${imgs[@]}"; do
            sudo bash scripts/install-mpv-hwdec.sh "$f"
          done

      - name: Compress
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        run: |
          shopt -s nullglob
          imgs=(/tmp/armbian-build/output/images/*.img)
          [ ${#imgs[@]} -ge 1 ] || { echo "::error::no .img found to compress"; df -h >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          df -h /
          for f in "${imgs[@]}"; do
            out="/tmp/redbox-mini6-${VARIANT}-$(date +%Y%m%d).img.xz"
            nice -n 5 xz -T0 -1 -c "$f" > "$out"
            sha256sum "$out" | tee /tmp/redbox-mini6-${VARIANT}.sha256
            rm -f "$f"
          done
          ls -lh /tmp/redbox-mini6-${VARIANT}*

      - name: Save image to cache (attempt 1)
        id: imgsave
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/redbox-mini6-${{ matrix.id }}*.img.xz
            /tmp/redbox-mini6-${{ matrix.id }}.sha256
          key: img-redbox-mini6-${{ matrix.id }}-${{ github.run_id }}

      - name: Save image to cache (attempt 2, if attempt 1 failed)
        if: steps.gate.outputs.skip == 'no' && steps.plan.outputs.need_build == 'yes' && steps.imgsave.outcome != 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/redbox-mini6-${{ matrix.id }}*.img.xz
            /tmp/redbox-mini6-${{ matrix.id }}.sha256
          key: img-redbox-mini6-${{ matrix.id }}-${{ github.run_id }}-r2

      - name: Upload image artifact before attach
        if: steps.gate.outputs.skip == 'no'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.id }}
          path: |
            /tmp/redbox-mini6-*.img.xz
            /tmp/redbox-mini6-*.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Courier (push image chunks via git, bypass uploads.github.com)
        if: steps.gate.outputs.skip == 'no'
        continue-on-error: true
        run: |
          set -e
          f=$(ls /tmp/${COURIER_PREFIX}-*.img.xz 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "courier: no image found"; exit 0; fi
          base=$(basename "$f")
          d=courier/${VARIANT:-img}
          rm -rf "$d"; mkdir -p "$d"
          split -b 90m -d "$f" "$d/${base}.part-"
          [ -f "/tmp/${COURIER_PREFIX}.sha256" ] && cp "/tmp/${COURIER_PREFIX}.sha256" "$d/"
          {
            echo "# Reassemble $base"
            echo "cat $(basename "$base")*.part-*' > $base  # (in this folder: cat *.part-* > $base)"
            echo "sha256sum -c *.sha256"
            echo "# then attach manually to release v1.0 (web UI) or: gh release upload v1.0 --clobber $base"
          } > "$d/README.txt"
          git checkout -B courier/dist
          git add -f "$d"
          git -c user.name=ci -c user.email=ci@localhost commit -qm "courier: $base (90MB parts)"
          ok=0
          for i in $(seq 1 15); do
            timeout 300 git push -qf origin courier/dist && { ok=1; break; }
            echo "courier retry $i $(date -u +%T)" | tee -a /tmp/courier.log
            git checkout -B courier/dist  # chunks may have been lost if retries landed halfway
            sleep 60
          done
          if [ "$ok" = 1 ]; then echo "courier: pushed $base as $(ls "$d" | wc -l) parts to courier/dist"; else echo "courier: FAILED after 15 retries"; fi

      - name: Attach to v1.0 release
        if: steps.gate.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f /tmp/attach.log
          for i in $(seq 1 20); do
            timeout 120 gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            timeout 300 gh release create v1.0 --repo "$GITHUB_REPOSITORY" \
              --title "Redbox Mini 6 (v1) — v1.0" \
              --notes "Armbian (minimal, LXQt) и LibreELEC с DTB Redbox Mini 6 v1, mpv с аппаратным декодированием cedrus/V4L2-Request" && break
            echo "retry create $i $(date -u +%T)" | tee -a /tmp/attach.log; sleep 30
          done
          up_ok=0
          for i in $(seq 1 30); do
            timeout 900 gh release upload v1.0 --repo "$GITHUB_REPOSITORY" --clobber \
              /tmp/redbox-mini6-${{ matrix.id }}-*.img.xz /tmp/redbox-mini6-${{ matrix.id }}.sha256 2>>/tmp/attach.log && { up_ok=1; break; }
            echo "retry upload $i $(date -u +%T)" | tee -a /tmp/attach.log; sleep 60
          done
          echo "## attach (${{ matrix.id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "upload ok: $up_ok" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 /tmp/attach.log 2>/dev/null | grep -viE 'x-access-token|ghs_|token ' | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Complete missing .sha256 on v1.0
        if: steps.gate.outputs.skip == 'sha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for i in $(seq 1 10); do
            timeout 900 gh release download v1.0 --repo "$GITHUB_REPOSITORY" --pattern "redbox-mini6-${VARIANT}-*.img.xz" --dir /tmp && break
            echo "retry download $i $(date -u +%T)"; sleep 30
          done
          f=$(ls /tmp/redbox-mini6-${VARIANT}-*.img.xz | head -1)
          sha256sum "$f" | sed 's|  .*/|  |' | tee /tmp/redbox-mini6-${VARIANT}.sha256
          for i in $(seq 1 10); do
            timeout 900 gh release upload v1.0 --repo "$GITHUB_REPOSITORY" --clobber /tmp/redbox-mini6-${VARIANT}.sha256 && break
            echo "retry sha upload $i $(date -u +%T)"; sleep 30
          done

      - name: Upload build diagnostics (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: /tmp/armbian-build/compile.log
          if-no-files-found: ignore

  build-libreelec:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'LE:')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      COURIER_PREFIX: libreelec-redbox-mini6
    steps:
      - uses: actions/checkout@v4

      - name: Gate (skip LE if its asset is already on v1.0)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: libreelec-redbox-mini6
        run: |
          names=$(timeout 60 gh release view v1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]|join(" ")' 2>/dev/null || echo '')
          if echo "$names" | grep -q "libreelec-redbox-mini6-"; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "LE asset already on v1.0 - skip"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "LE asset missing - build"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghc /usr/local/share/boost /usr/lib/jvm \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build LibreELEC (H6 / tanix-tx6)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev bc bison build-essential bzip2 \
            flex gawk gettext gperf intltool libfl-dev libncurses-dev \
            libparse-yapp-perl libtool libxml-parser-perl libzip-dev lzop \
            patchutils pkg-config python3 rdfind rsync shtool swig unzip \
            uuid-dev wget default-jre-headless xfonts-utils xsltproc \
            zlib1g-dev curl lua5.2
          git clone --depth=1 --branch 12.95.1 https://github.com/LibreELEC/LibreELEC.tv.git /tmp/le-build
          sed -e 's|PKG_VERSION="1.8.3"|PKG_VERSION="1.8.2"|' \
              -e 's|PKG_SHA256="21b26bc75cd37b548d7952f2794cde711efa6c6151c4147cc3c52cfedbf11df4"|PKG_SHA256="3b888e01f3d25f7914bbfd31139066bb4547e079322975134b03c92e4c6a2066"|' \
              -i /tmp/le-build/packages/debug/libunwind/package.mk
          sed -e 's|PKG_URL="http://bitmath.org/code/mtdev/\${PKG_NAME}-\${PKG_VERSION}.tar.bz2"|PKG_URL="https://deb.debian.org/debian/pool/main/m/mtdev/mtdev_1.1.7.orig.tar.gz"|' \
              -e 's|PKG_SHA256="a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e"|PKG_SHA256="a55bd02a9af4dd266c0042ec608744fff3a017577614c057da09f1f4566ea32c"|' \
              -i /tmp/le-build/packages/wayland/mtdev/package.mk
          sed -e 's|PKG_URL="https://linuxtv.org/downloads/v4l-utils/\${PKG_NAME}-\${PKG_VERSION}.tar.xz"|PKG_URL="https://deb.debian.org/debian/pool/main/v/v4l-utils/v4l-utils_1.32.0.orig.tar.xz"|' \
              -i /tmp/le-build/packages/sysutils/v4l-utils/package.mk
          grep -E 'PKG_VERSION|PKG_SHA256' /tmp/le-build/packages/debug/libunwind/package.mk
          grep -E 'PKG_URL' /tmp/le-build/packages/wayland/mtdev/package.mk
          cd /tmp/le-build
          PROJECT=Allwinner DEVICE=H6 ARCH=aarch64 make image
          find target -maxdepth 1 -name '*.img*' | xargs ls -lh

      - name: Inject Redbox Mini 6 DTB
        if: steps.gate.outputs.skip != 'yes'
        run: |
          shopt -s nullglob
          for f in /tmp/le-build/target/*tanix-tx6*.img.gz; do gunzip -kf "$f"; done
          for f in /tmp/le-build/target/*tanix-tx6*.img; do
            sudo bash scripts/inject-le-dtb.sh "$f"
          done
          ls -lh /tmp/le-build/target/

      - name: Compress
        if: steps.gate.outputs.skip != 'yes'
        run: |
          for f in /tmp/le-build/target/*tanix-tx6*.img; do
            [ -f "$f" ] || continue
            out="/tmp/libreelec-redbox-mini6-$(date +%Y%m%d).img.xz"
            xz -T0 -2 -c "$f" > "$out"
            sha256sum "$out" | tee /tmp/libreelec-redbox-mini6.sha256
            rm -f "$f"
          done

      - name: Upload image artifact before attach
        if: steps.gate.outputs.skip == 'no'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: images-libreelec
          path: |
            /tmp/libreelec-redbox-mini6-*.img.xz
            /tmp/libreelec-redbox-mini6.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Courier (push image chunks via git, bypass uploads.github.com)
        if: steps.gate.outputs.skip == 'no'
        continue-on-error: true
        run: |
          set -e
          f=$(ls /tmp/${COURIER_PREFIX}-*.img.xz 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "courier: no image found"; exit 0; fi
          base=$(basename "$f")
          d=courier/${VARIANT:-img}
          rm -rf "$d"; mkdir -p "$d"
          split -b 90m -d "$f" "$d/${base}.part-"
          [ -f "/tmp/${COURIER_PREFIX}.sha256" ] && cp "/tmp/${COURIER_PREFIX}.sha256" "$d/"
          {
            echo "# Reassemble $base"
            echo "cat $(basename "$base")*.part-*' > $base  # (in this folder: cat *.part-* > $base)"
            echo "sha256sum -c *.sha256"
            echo "# then attach manually to release v1.0 (web UI) or: gh release upload v1.0 --clobber $base"
          } > "$d/README.txt"
          git checkout -B courier/dist
          git add -f "$d"
          git -c user.name=ci -c user.email=ci@localhost commit -qm "courier: $base (90MB parts)"
          ok=0
          for i in $(seq 1 15); do
            timeout 300 git push -qf origin courier/dist && { ok=1; break; }
            echo "courier retry $i $(date -u +%T)" | tee -a /tmp/courier.log
            git checkout -B courier/dist  # chunks may have been lost if retries landed halfway
            sleep 60
          done
          if [ "$ok" = 1 ]; then echo "courier: pushed $base as $(ls "$d" | wc -l) parts to courier/dist"; else echo "courier: FAILED after 15 retries"; fi

      - name: Attach to v1.0 release
        if: steps.gate.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          which gh
          for i in $(seq 1 60); do
            timeout 120 gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            timeout 300 gh release create v1.0 --repo "$GITHUB_REPOSITORY" \
              --title "Redbox Mini 6 (v1) — v1.0" \
              --notes "Armbian (minimal, LXQt) и LibreELEC с DTB Redbox Mini 6 v1, mpv с аппаратным декодированием cedrus/V4L2-Request" && break
            echo "retry create $i"; sleep 30
          done
          for i in $(seq 1 60); do
            timeout 1800 gh release upload v1.0 --repo "$GITHUB_REPOSITORY" --clobber \
              /tmp/libreelec-redbox-mini6-*.img.xz /tmp/libreelec-redbox-mini6.sha256 && break
            echo "retry upload $i"; sleep 30
          done
          timeout 120 gh release view v1.0 --repo "$GITHUB_REPOSITORY" --json assets

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: libreelec-redbox-mini6
          path: /tmp/libreelec-redbox-mini6-*.img.xz
          compression-level: 0
          if-no-files-found: error
