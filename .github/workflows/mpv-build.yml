name: mpv v4l2-request (aarch64)

on:
  push:
    paths:
      - '.github/workflows/mpv-build.yml'
      - 'scripts/build-mpv-v4l2req.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached tarball
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/mpv-v4l2req.tar.gz
          key: mpv-v4l2req-ffmpeg-v4l2request-hwaccel-mpv-0.42.0

      - name: Build in arm64 trixie container
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/ws:ro" \
            -v /tmp/mpv-v4l2req.tar.gz:/tmp/mpv-v4l2req.tar.gz \
            -v /tmp/outvol:/out \
            arm64v8/debian:trixie \
            bash -c 'cp -r /ws /ws-rw && cd /ws-rw && OUT=/out WS=/ws-rw bash scripts/build-mpv-v4l2req.sh'
          ls -lh /tmp/mpv-v4l2req.tar.gz

      - name: Save to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/mpv-v4l2req.tar.gz
          key: mpv-v4l2req-ffmpeg-v4l2request-hwaccel-mpv-0.42.0

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-v4l2req
          path: /tmp/mpv-v4l2req.tar.gz
          compression-level: 0
          if-no-files-found: error
